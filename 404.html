<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #e8f5e9 0%, #c8e6c9 100%);
      font-family: 'Fredoka', sans-serif;
      color: #2e4a36;
      overflow: hidden;
      position: relative;
    }

    /* Floating background bubbles */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      box-shadow: inset -5px -5px 12px rgba(255, 255, 255, 0.7), 
                  0 4px 15px rgba(0, 0, 0, 0.05);
      animation: floatUp 8s infinite ease-in-out;
      pointer-events: none;
    }

    .bubble:nth-child(1) { width: 50px; height: 50px; left: 12%; bottom: -60px; animation-duration: 9s; }
    .bubble:nth-child(2) { width: 35px; height: 35px; left: 25%; bottom: -50px; animation-duration: 7s; animation-delay: 1.5s; }
    .bubble:nth-child(3) { width: 65px; height: 65px; right: 18%; bottom: -70px; animation-duration: 11s; animation-delay: 0.5s; }
    .bubble:nth-child(4) { width: 25px; height: 25px; right: 30%; bottom: -40px; animation-duration: 8.5s; animation-delay: 2.2s; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      padding: 3rem 2.5rem;
      border-radius: 35px;
      box-shadow: 0 20px 45px rgba(46, 74, 54, 0.12);
      text-align: center;
      max-width: 440px;
      width: 90%;
      border: 3px solid #ffffff;
      animation: cardBounce 1s ease-out;
    }

    @keyframes cardBounce {
      0% { transform: translateY(30px) scale(0.95); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .panda-wrapper {
      width: 170px;
      height: 170px;
      margin: 0 auto 1.25rem;
      animation: gentleWiggle 3.5s ease-in-out infinite;
    }

    @keyframes gentleWiggle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    h1 {
      font-size: 4.5rem;
      line-height: 1;
      font-weight: 700;
      color: #388e3c;
      letter-spacing: -2px;
      margin-bottom: 0.25rem;
      text-shadow: 2px 2px 0px #a5d6a7;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #2e4a36;
    }

    p {
      font-size: 1rem;
      color: #55715d;
      margin-bottom: 1.75rem;
      line-height: 1.4;
    }

    .home-btn {
      display: inline-block;
      text-decoration: none;
      background: #4caf50;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      box-shadow: 0 8px 18px rgba(76, 175, 80, 0.35);
      transition: all 0.25s ease;
    }

    .home-btn:hover {
      background: #43a047;
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(76, 175, 80, 0.45);
    }
  </style>
</head>
<body>

  <!-- Floating bubbles -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="card">
    <div class="panda-wrapper">
      <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <!-- Ears -->
        <circle cx="50" cy="50" r="28" fill="#263238" />
        <circle cx="50" cy="50" r="16" fill="#37474f" />
        <circle cx="150" cy="50" r="28" fill="#263238" />
        <circle cx="150" cy="50" r="16" fill="#37474f" />

        <!-- Head -->
        <circle cx="100" cy="108" r="68" fill="#ffffff" stroke="#eceff1" stroke-width="3" />

        <!-- Eye Patches -->
        <ellipse cx="74" cy="98" rx="19" ry="24" fill="#263238" transform="rotate(-15 74 98)" />
        <ellipse cx="126" cy="98" rx="19" ry="24" fill="#263238" transform="rotate(15 126 98)" />

        <!-- Eyes & Highlights -->
        <circle cx="75" cy="99" r="6" fill="#ffffff" />
        <circle cx="77" cy="97" r="2.5" fill="#263238" />
        <circle cx="125" cy="99" r="6" fill="#ffffff" />
        <circle cx="127" cy="97" r="2.5" fill="#263238" />

        <!-- Rosy Cheeks -->
        <circle cx="58" cy="120" r="10" fill="#ffcdd2" opacity="0.8" />
        <circle cx="142" cy="120" r="10" fill="#ffcdd2" opacity="0.8" />

        <!-- Nose -->
        <polygon points="94,116 106,116 100,123" fill="#263238" />

        <!-- Mouth -->
        <path d="M 94 125 Q 100 131 106 125" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round" />

        <!-- Little Floating Bamboo Leaves -->
        <path d="M 148 150 Q 165 140 170 155 Q 155 160 148 150 Z" fill="#81c784" />
      </svg>
    </div>

    <h1>200 OK</h1>
    <p>Existential crisis.</p>
    <a href="/" class="home-btn">Bye Bye</a>
  </div>

</body>
</html>
